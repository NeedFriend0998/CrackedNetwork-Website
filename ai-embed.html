<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>CrackedNetwork AI — Server Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lucide-static@latest/font/lucide.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #0a0b0e;
  --card: #15171b;
  --card-hover: #1c1f24;
  --bubble-ai: #15171b;
  --input-bg: #16181c;
  --border: #24272d;
  --border-soft: #1c1f24;
  --text: #ececf1;
  --text-muted: #8b8e96;
  --text-soft: #5f6368;
  --accent: #10b981;
  --accent-2: #059669;
  --accent-glow: rgba(16, 185, 129, 0.4);
  --accent-soft: rgba(16, 185, 129, 0.1);
  --danger: #ef4444;
  --radius: 14px;
  --radius-sm: 10px;
  --radius-bubble: 18px;
  --shadow: 0 8px 32px rgba(0,0,0,0.4);
  --think-bg: #2a2d35;
}

html, body { 
  height: 100%; 
  overflow: hidden; 
  touch-action: manipulation;
}
body {
  font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  background-image:
    radial-gradient(circle at 0% 0%, rgba(16, 185, 129, 0.07), transparent 45%),
    radial-gradient(circle at 100% 100%, rgba(99, 102, 241, 0.05), transparent 45%);
  color: var(--text);
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none;
  -moz-user-select: none;
  -ms-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}

button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; user-select: none; }
input, textarea { 
  font-family: inherit; 
  outline: none; 
  -webkit-user-select: text; 
  -moz-user-select: text;
  -ms-user-select: text;
  user-select: text;
}

.app {
  display: flex;
  flex-direction: column;
  height: 100vh; 
  height: 100dvh; 
  width: 100vw;
  overflow: hidden;
}

/* ===== HEADER ===== */
.main-header {
  height: 56px;
  padding: 0 16px;
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px;
  border-bottom: 1px solid var(--border-soft);
  background: rgba(10, 11, 14, 0.7);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  z-index: 10;
  flex-shrink: 0;
}
.header-left { display: flex; align-items: center; gap: 10px; }
.logo { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 15px; }
.logo-mark {
  width: 32px; height: 32px;
  border-radius: 9px;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  display: flex; align-items: center; justify-content: center;
  color: white; font-weight: 800; font-size: 15px;
  box-shadow: 0 4px 14px var(--accent-glow);
  position: relative;
  flex-shrink: 0;
}
.logo-mark::after {
  content: ''; position: absolute; inset: 0; border-radius: 9px;
  background: linear-gradient(135deg, rgba(255,255,255,0.25), transparent 50%);
}
.logo-text { display: flex; flex-direction: column; line-height: 1.2; }
.logo-text span:last-child {
  font-size: 10px; font-weight: 500;
  color: var(--text-soft); margin-top: 2px;
  letter-spacing: 0.04em;
}

.header-right { display: flex; align-items: center; gap: 8px; }
.header-title {
  display: flex; align-items: center; gap: 6px;
  font-size: 12px; font-weight: 600;
  background: var(--card);
  padding: 6px 12px;
  border-radius: 20px;
  border: 1px solid var(--border);
}
.header-title .dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 10px var(--accent-glow);
  animation: pulse 2s infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.5; transform: scale(0.85); }
}
.icon-btn {
  width: 36px; height: 36px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-muted);
  transition: background .15s, color .15s;
  border: 1px solid var(--border);
  background: var(--card);
  flex-shrink: 0;
}
.icon-btn:hover { background: var(--card-hover); color: var(--text); }
.icon-btn i { font-size: 16px; }

/* ===== HISTORY DRAWER ===== */
.overlay-drawer {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.6);
  opacity: 0; visibility: hidden;
  transition: opacity .2s;
  z-index: 40;
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
}
.overlay-drawer.active { opacity: 1; visibility: visible; }

.history-drawer {
  position: fixed;
  top: 0; left: -300px;
  width: 280px; height: 100%;
  background: var(--bg);
  border-right: 1px solid var(--border);
  z-index: 50;
  display: flex;
  flex-direction: column;
  transition: left 0.3s cubic-bezier(.4,0,.2,1);
}
.history-drawer.open { left: 0; }
.drawer-header {
  padding: 16px;
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid var(--border-soft);
}
.drawer-header h3 { font-size: 16px; font-weight: 700; }
.drawer-body {
  flex: 1;
  overflow-y: auto;
  padding: 12px;
}
.history-item {
  padding: 12px;
  border-radius: var(--radius-sm);
  background: var(--card);
  margin-bottom: 8px;
  cursor: pointer;
  transition: background .15s, border-color .15s;
  border: 1px solid transparent;
}
.history-item:hover { background: var(--card-hover); }
.history-item.active { border-color: var(--accent); background: var(--card-hover); }
.history-item .h-title {
  font-size: 13px; font-weight: 600;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  margin-bottom: 4px;
}
.history-item .h-time {
  font-size: 11px; color: var(--text-soft);
}
.drawer-footer {
  padding: 12px;
  border-top: 1px solid var(--border-soft);
}
.btn-new-chat {
  width: 100%;
  padding: 10px;
  border-radius: var(--radius-sm);
  background: var(--accent);
  color: black;
  font-weight: 700;
  font-size: 13px;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  transition: background .15s;
}
.btn-new-chat:hover { background: var(--accent-2); }
.empty-history {
  text-align: center;
  color: var(--text-soft);
  font-size: 13px;
  padding: 40px 20px;
}

/* ===== MAIN ===== */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-height: 0; 
  position: relative;
}

/* ===== CHAT AREA ===== */
.chat-area {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  display: flex;
  flex-direction: column;
  scroll-behavior: smooth;
  -webkit-overflow-scrolling: touch;
  min-height: 0; 
}
.chat-container {
  max-width: 820px;
  width: 100%;
  margin: 0 auto;
  padding: 24px 16px 32px;
  flex: 1;
  display: flex;
  flex-direction: column;
}

.welcome {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center;
  flex: 1;
  padding: 20px;
}
.welcome-logo {
  width: 56px; height: 56px;
  border-radius: 16px;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  display: flex; align-items: center; justify-content: center;
  color: white; font-weight: 800; font-size: 24px;
  margin-bottom: 20px;
  box-shadow: 0 12px 32px var(--accent-glow);
  position: relative;
  animation: welcomeIn .6s cubic-bezier(.4,0,.2,1);
}
.welcome-logo::after {
  content: ''; position: absolute; inset: 0;
  border-radius: 16px;
  background: linear-gradient(135deg, rgba(255,255,255,0.3), transparent 50%);
}
@keyframes welcomeIn {
  from { transform: scale(.5) rotate(-15deg); opacity: 0; }
  to { transform: scale(1) rotate(0); opacity: 1; }
}
.welcome h1 {
  font-size: 24px;
  font-weight: 700;
  margin-bottom: 8px;
  letter-spacing: -0.02em;
  background: linear-gradient(135deg, #ececf1, #8b8e96);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: fadeUp .5s .15s both;
}
.welcome p {
  color: var(--text-muted);
  font-size: 14px;
  margin-bottom: 28px;
  animation: fadeUp .5s .25s both;
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
.suggestions {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  width: 100%;
  max-width: 680px;
  animation: fadeUp .5s .35s both;
}
.suggestion-card {
  text-align: left;
  padding: 12px 14px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  font-size: 13px;
  transition: background .15s, border-color .15s, transform .12s;
  display: flex; flex-direction: column; gap: 3px;
}
.suggestion-card:hover {
  background: var(--card-hover);
  border-color: var(--accent);
  transform: translateY(-2px);
}
.suggestion-card:active { transform: translateY(0); }
.suggestion-title { font-weight: 600; }
.suggestion-desc { font-size: 11px; color: var(--text-soft); }

/* ===== MESSAGES ===== */
.msg {
  margin-bottom: 20px;
  animation: msgIn .35s cubic-bezier(.4,0,.2,1);
}
@keyframes msgIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
.msg-row { display: flex; gap: 10px; align-items: flex-start; }
.msg-row.user { flex-direction: row-reverse; }
.msg-avatar {
  width: 30px; height: 30px;
  border-radius: 8px;
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700;
  color: white;
}
.msg-avatar.ai {
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  box-shadow: 0 4px 12px var(--accent-glow);
}
.msg-avatar.user {
  background: linear-gradient(135deg, #6b7280, #4b5563);
}
.msg-content-wrap { min-width: 0; max-width: 80%; }
.msg-row.user .msg-content-wrap { display: flex; flex-direction: column; align-items: flex-end; }
.msg-bubble {
  padding: 10px 14px;
  border-radius: var(--radius-bubble);
  font-size: 14px;
  line-height: 1.6;
  word-wrap: break-word;
  overflow-wrap: break-word;
}
.msg-row.user .msg-bubble {
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  color: white;
  border-bottom-right-radius: 6px;
  box-shadow: 0 4px 14px var(--accent-glow);
}
.msg-row.ai .msg-bubble {
  background: var(--bubble-ai);
  border: 1px solid var(--border);
  border-bottom-left-radius: 6px;
}
.msg-text p { margin-bottom: 8px; }
.msg-text p:last-child { margin-bottom: 0; }
.msg-text code {
  background: rgba(0,0,0,0.3);
  padding: 2px 6px;
  border-radius: 4px;
  font-size: 13px;
  font-family: 'JetBrains Mono', monospace;
}
.msg-row.user .msg-text code { background: rgba(255,255,255,0.2); }
.msg-text pre {
  background: #0a0b0e;
  border: 1px solid var(--border);
  padding: 12px 14px;
  border-radius: var(--radius-sm);
  overflow-x: auto;
  margin: 10px 0;
  font-size: 13px;
}
.msg-text pre code {
  background: none; padding: 0; color: #c9d1d9;
  font-family: 'JetBrains Mono', monospace;
}
.msg-text ul, .msg-text ol { margin: 8px 0 8px 22px; }
.msg-text li { margin-bottom: 4px; }
.msg-text strong { font-weight: 700; }
.msg-text em { font-style: italic; }

.msg-meta {
  display: flex; gap: 4px;
  margin-top: 6px;
  opacity: 0;
  transition: opacity .15s;
}
.msg:hover .msg-meta { opacity: 1; }
.msg-action-btn {
  padding: 4px 8px;
  border-radius: 6px;
  color: var(--text-soft);
  font-size: 12px;
  display: flex; align-items: center; gap: 4px;
  transition: background .12s, color .12s;
}
.msg-action-btn:hover { background: var(--card-hover); color: var(--text); }
.msg-action-btn i { font-size: 13px; }

.edited-tag {
  font-size: 10px;
  color: var(--text-soft);
  margin-left: 4px;
  font-style: italic;
}

/* Edit Textarea */
.edit-textarea {
  width: 100%;
  background: rgba(0,0,0,0.2);
  color: white;
  border: 1px solid var(--accent);
  border-radius: 8px;
  padding: 8px;
  resize: none;
  font-family: inherit;
  font-size: 14px;
  line-height: 1.6;
  min-height: 60px;
}
.edit-actions {
  display: flex;
  gap: 8px;
  margin-top: 8px;
  justify-content: flex-end;
}
.edit-btn {
  font-size: 12px;
  padding: 4px 10px;
  border-radius: 6px;
  cursor: pointer;
  font-weight: 600;
}
.edit-btn.cancel { background: var(--card-hover); color: var(--text-muted); }
.edit-btn.save { background: var(--accent); color: black; }

/* ===== THINKING BOX ===== */
.thinking-box {
  background: var(--think-bg);
  border-radius: var(--radius);
  max-width: 80%;
  width: fit-content;
  min-width: 200px;
  margin: 0 0 12px 40px;
  padding: 12px 16px;
  position: relative;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
  user-select: none;
}
.thinking-header {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-muted);
  cursor: grab;
}
.thinking-header:active { cursor: grabbing; }
.thinking-box.dragging {
  box-shadow: 0 10px 20px rgba(0,0,0,0.4);
  opacity: 0.9;
  z-index: 10;
}
.thinking-header .brain-icon { font-size: 15px; }
.thinking-header .label { flex: 1; }
.thinking-header .toggle-btn {
  color: var(--text-soft);
  padding: 2px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.thinking-header .toggle-btn i { font-size: 14px; transition: transform 0.2s; }
.thinking-box.collapsed .toggle-btn i { transform: rotate(-90deg); }

.thinking-body {
  margin-top: 8px;
  font-size: 13px;
  line-height: 1.5;
  color: var(--text-muted);
  opacity: 0.75;
  filter: blur(0.3px);
  white-space: pre-wrap;
  word-wrap: break-word;
  max-height: 300px;
  overflow-y: auto;
  transition: max-height 0.3s ease, opacity 0.3s ease, margin-top 0.3s ease, filter 0.3s ease;
}
.thinking-box.collapsed .thinking-body {
  max-height: 0;
  opacity: 0;
  margin-top: 0;
  filter: blur(5px);
  overflow: hidden;
}

/* Thinking animation (loading dots) */
.thinking .msg-bubble {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 16px;
}
.thinking-text {
  font-size: 13px;
  color: var(--text-muted);
  font-style: italic;
}
.thinking-dots { display: inline-flex; gap: 5px; align-items: center; }
.thinking-dots span {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--accent);
  animation: bounce 1.4s infinite ease-in-out both;
}
.thinking-dots span:nth-child(1) { animation-delay: -0.32s; }
.thinking-dots span:nth-child(2) { animation-delay: -0.16s; }
@keyframes bounce {
  0%, 80%, 100% { transform: scale(0.5); opacity: 0.4; }
  40% { transform: scale(1); opacity: 1; }
}
.ai-avatar-thinking { animation: avatarPulse 1.5s infinite; }
@keyframes avatarPulse {
  0%, 100% { box-shadow: 0 0 0 0 var(--accent-glow), 0 4px 12px var(--accent-glow); }
  50% { box-shadow: 0 0 0 8px transparent, 0 4px 12px var(--accent-glow); }
}

/* ===== INPUT AREA ANIMATION ===== */
.input-area {
  padding: 10px 16px 16px;
  background: linear-gradient(to top, var(--bg) 60%, transparent);
  flex-shrink: 0;
  overflow: hidden;
}
.input-wrap {
  max-width: 820px;
  margin: 0 auto;
  background: var(--input-bg);
  border: 1px solid var(--border);
  border-radius: 24px;
  padding: 6px 6px 6px 16px;
  display: flex;
  align-items: flex-end;
  gap: 8px;
  transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}
.input-wrap:focus-within {
  border-color: var(--accent);
  box-shadow: 0 8px 24px rgba(16, 185, 129, 0.15), 0 0 0 4px var(--accent-soft);
  transform: translateY(-3px);
}
.input-textarea {
  flex: 1;
  border: none; background: none;
  color: var(--text);
  font-size: 15px;
  line-height: 1.5;
  resize: none; 
  -webkit-appearance: none;
  padding: 8px 0;
  max-height: 120px;
  min-height: 24px;
  overflow-y: auto;
  transition: min-height 0.25s ease;
}
.input-wrap:focus-within .input-textarea {
  min-height: 32px;
}
.input-textarea::placeholder { 
  color: var(--text-soft); 
}

.input-tools { display: flex; gap: 4px; align-items: center; }
.tool-btn {
  width: 34px; height: 34px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-muted);
  transition: background .15s, color .15s;
  flex-shrink: 0;
}
.tool-btn:hover { background: var(--card-hover); color: var(--text); }
.tool-btn i { font-size: 18px; }
.send-btn {
  width: 34px; height: 34px;
  border-radius: 50%;
  background: var(--accent);
  color: white;
  display: flex; align-items: center; justify-content: center;
  transition: background .15s, transform .1s, opacity .15s;
  flex-shrink: 0;
}
.send-btn:hover:not(:disabled) { background: var(--accent-2); }
.send-btn:active:not(:disabled) { transform: scale(.92); }
.send-btn:disabled {
  background: var(--card-hover);
  color: var(--text-soft);
  cursor: not-allowed;
}
.send-btn i { font-size: 18px; }
.input-hint {
  text-align: center;
  font-size: 10px;
  color: var(--text-soft);
  margin-top: 6px;
  max-width: 820px;
  margin-left: auto; margin-right: auto;
}

/* ===== MOBILE ===== */
@media (max-width: 600px) {
  .main-header { height: 52px; padding: 0 12px; }
  .logo { gap: 8px; font-size: 14px; }
  .logo-mark { width: 30px; height: 30px; font-size: 14px; }
  .logo-text span:last-child { display: none; }
  .header-title { display: none; }
  
  .welcome h1 { font-size: 20px; }
  .welcome p { font-size: 13px; margin-bottom: 20px; }
  .welcome-logo { width: 48px; height: 48px; font-size: 20px; margin-bottom: 16px; }
  
  .suggestions { grid-template-columns: 1fr; gap: 8px; }
  .suggestion-card { padding: 10px 12px; }
  
  .chat-container { padding: 16px 12px 24px; }
  .input-area { padding: 8px 12px 12px; }
  .msg-content-wrap { max-width: 85%; }
  .msg-bubble { font-size: 13.5px; padding: 10px 12px; }
  
  .thinking-box { max-width: 85%; margin-left: 30px; }
  .history-drawer { width: 260px; left: -280px; }
}

::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-soft); }

/* Toast */
.toast {
  position: fixed;
  bottom: 80px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 10px 16px;
  border-radius: var(--radius);
  font-size: 13px;
  font-weight: 500;
  box-shadow: var(--shadow);
  opacity: 0; visibility: hidden;
  transition: opacity .2s, transform .2s, visibility .2s;
  z-index: 200;
  display: flex; align-items: center; gap: 8px;
}
.toast.show { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }
.toast i { font-size: 16px; color: var(--accent); }
.toast.error i { color: var(--danger); }

/* Modal */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  display: flex; align-items: center; justify-content: center;
  z-index: 300;
  opacity: 0; visibility: hidden;
  transition: opacity .2s;
  padding: 20px;
}
.modal-overlay.show { opacity: 1; visibility: visible; }
.modal {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  max-width: 360px;
  width: 100%;
  transform: scale(.95);
  transition: transform .2s;
}
.modal-overlay.show .modal { transform: scale(1); }
.modal-icon {
  width: 40px; height: 40px;
  border-radius: 10px;
  background: rgba(239, 68, 68, 0.12);
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 12px;
}
.modal-icon i { font-size: 20px; color: var(--danger); }
.modal h3 { font-size: 16px; font-weight: 700; margin-bottom: 8px; }
.modal p { color: var(--text-muted); font-size: 13px; margin-bottom: 16px; line-height: 1.6; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; }
.btn {
  padding: 8px 14px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  font-weight: 600;
  transition: background .15s, transform .1s;
}
.btn:active { transform: scale(.97); }
.btn-ghost { color: var(--text-muted); }
.btn-ghost:hover { background: var(--card-hover); color: var(--text); }
.btn-danger { background: var(--danger); color: white; }
.btn-danger:hover { background: #dc2626; }
</style>
</head>
<body>

<!-- HISTORY DRAWER -->
<div class="overlay-drawer" id="drawerOverlay"></div>
<aside class="history-drawer" id="historyDrawer">
  <div class="drawer-header">
    <h3>Chat History</h3>
    <button class="icon-btn" id="closeDrawerBtn" title="Close"><i class="icon-x"></i></button>
  </div>
  <div class="drawer-body" id="historyList">
    <div class="empty-history">No history yet</div>
  </div>
  <div class="drawer-footer">
    <button class="btn-new-chat" id="newChatDrawerBtn">
      <i class="icon-plus"></i> New Chat
    </button>
  </div>
</aside>

<div class="app">
  <header class="main-header">
    <div class="header-left">
      <button class="icon-btn" id="historyToggleBtn" title="Chat History">
        <i class="icon-clock-3"></i>
      </button>
      <div class="logo">
        <div class="logo-mark">C</div>
        <div class="logo-text">
          <span>CrackedNetwork AI</span>
          <span>Server Assistant</span>
        </div>
      </div>
    </div>
    <div class="header-right">
      <div class="header-title">
        <span class="dot"></span>
        <span>AI Online</span>
      </div>
      <button class="icon-btn" id="resetMemoryBtn" title="Reset All Memory">
        <i class="icon-trash-2"></i>
      </button>
    </div>
  </header>

  <main class="main">
    <div class="chat-area" id="chatArea">
      <div class="chat-container" id="chatContainer">
        <!-- Welcome screen or messages will be injected here by JS -->
      </div>
    </div>

    <div class="input-area">
      <div class="input-wrap">
        <textarea
          class="input-textarea"
          id="inputTextarea"
          placeholder="Type your message..."
          rows="1"
        ></textarea>
        <div class="input-tools">
          <button class="tool-btn" title="Attach file"><i class="icon-paperclip"></i></button>
          <button class="send-btn" id="sendBtn" disabled>
            <i class="icon-arrow-up"></i>
          </button>
        </div>
      </div>
      <div class="input-hint">CrackedNetwork AI can make mistakes. Verify important information.</div>
    </div>
  </main>
</div>

<div class="toast" id="toast">
  <i class="icon-check-circle"></i>
  <span id="toastText">Copied</span>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-icon"><i class="icon-trash-2"></i></div>
    <h3>Reset All Memory?</h3>
    <p>All local chat history and backend memory will be permanently deleted. This action cannot be undone.</p>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="modalCancel">Cancel</button>
      <button class="btn btn-danger" id="modalConfirm">Yes, Reset</button>
    </div>
  </div>
</div>

<script>
  // ===== CONFIG API =====
  const API_BASE = '/.netlify/functions/ai';

  // ===== STATE MANAGEMENT =====
  // Sessions structure: { "sess-123": { id, title, timestamp, messages: [{role, text, thinking, edited}] } }
  const state = {
    baseUserId: localStorage.getItem('cn_user_id') || generateUserId(),
    isWaiting: false,
    currentSessionId: null,
    sessions: JSON.parse(localStorage.getItem('cn_sessions') || '{}')
  };
  localStorage.setItem('cn_user_id', state.baseUserId);

  function generateUserId() {
    return 'guest-' + Math.random().toString(36).substring(2, 11) + Date.now().toString(36);
  }

  function saveSessions() {
    localStorage.setItem('cn_sessions', JSON.stringify(state.sessions));
  }

  function getApiUserId() {
    // Use session ID as API user_id to isolate memory per session
    return state.currentSessionId || state.baseUserId;
  }

  // ===== ELEMENTS =====
  const $ = (id) => document.getElementById(id);
  const input = $('inputTextarea');
  const sendBtn = $('sendBtn');
  const chatContainer = $('chatContainer');
  const chatArea = $('chatArea');
  const toast = $('toast');
  const toastText = $('toastText');

  // ===== HISTORY DRAWER LOGIC =====
  const drawer = $('historyDrawer');
  const drawerOverlay = $('drawerOverlay');

  $('historyToggleBtn').addEventListener('click', () => {
    drawer.classList.add('open');
    drawerOverlay.classList.add('active');
    renderHistoryList();
  });

  $('closeDrawerBtn').addEventListener('click', closeDrawer);
  drawerOverlay.addEventListener('click', closeDrawer);
  $('newChatDrawerBtn').addEventListener('click', () => {
    startNewChat();
    closeDrawer();
  });

  function closeDrawer() {
    drawer.classList.remove('open');
    drawerOverlay.classList.remove('active');
  }

  function renderHistoryList() {
    const list = $('historyList');
    list.innerHTML = '';
    const sessions = Object.values(state.sessions).sort((a, b) => b.timestamp - a.timestamp);
    
    if (sessions.length === 0) {
      list.innerHTML = '<div class="empty-history">No history yet</div>';
      return;
    }
    
    sessions.forEach(session => {
      const item = document.createElement('div');
      item.className = 'history-item';
      if (session.id === state.currentSessionId) item.classList.add('active');
      
      const date = new Date(session.timestamp);
      const timeStr = date.toLocaleString([], { hour: '2-digit', minute: '2-digit', day: '2-digit', month: 'short' });
      
      item.innerHTML = `
        <div class="h-title">${escapeHtml(session.title)}</div>
        <div class="h-time">${timeStr}</div>
      `;
      
      item.addEventListener('click', () => {
        loadSession(session.id);
        closeDrawer();
      });
      list.appendChild(item);
    });
  }

  function startNewChat() {
    state.currentSessionId = null;
    chatContainer.innerHTML = '';
    renderWelcome();
    input.focus();
  }

  function loadSession(sessionId) {
    state.currentSessionId = sessionId;
    const session = state.sessions[sessionId];
    if (!session) return;

    chatContainer.innerHTML = '';
    session.messages.forEach((msg, index) => {
      if (msg.thinking) {
        const thinkBox = createThinkingBox(msg.thinking, true);
        chatContainer.appendChild(thinkBox);
      }
      addMessage(msg.role, msg.text, false, msg.edited || false, index);
    });
    scrollToBottom();
  }

  // ===== RENDER WELCOME SCREEN =====
  function renderWelcome() {
    chatContainer.innerHTML = `
      <div class="welcome" id="welcome">
        <div class="welcome-logo">C</div>
        <h1>Hello, I am CrackedNetwork AI</h1>
        <p>Smart assistant for the CrackedNetwork server. How can I help you?</p>
        <div class="suggestions">
          <button class="suggestion-card" data-prompt="What AI are you?">
            <span class="suggestion-title">What AI are you?</span>
            <span class="suggestion-desc">Get to know this AI</span>
          </button>
          <button class="suggestion-card" data-prompt="Who made you?">
            <span class="suggestion-title">Who made you?</span>
            <span class="suggestion-desc">Ask about the creator</span>
          </button>
          <button class="suggestion-card" data-prompt="What is CrackedNetwork?">
            <span class="suggestion-title">What is CrackedNetwork?</span>
            <span class="suggestion-desc">Minecraft server info</span>
          </button>
          <button class="suggestion-card" data-prompt="Who is owner of CrackedNetwork?">
            <span class="suggestion-title">Who is the owner?</span>
            <span class="suggestion-desc">Ask about the owner</span>
          </button>
          <button class="suggestion-card" data-prompt="CrackedNetwork discord community">
            <span class="suggestion-title">Discord Community</span>
            <span class="suggestion-desc">Join the community</span>
          </button>
          <button class="suggestion-card" data-prompt="How to join CrackedNetwork server?">
            <span class="suggestion-title">How to join server?</span>
            <span class="suggestion-desc">IP & how to play</span>
          </button>
        </div>
      </div>
    `;
    bindSuggestions();
  }

  // ===== INIT APP =====
  function initApp() {
    const sessions = Object.values(state.sessions).sort((a, b) => b.timestamp - a.timestamp);
    if (sessions.length > 0) {
      loadSession(sessions[0].id);
    } else {
      renderWelcome();
    }
  }

  // ===== CLEAR THINKING BOXES (BUG FIX) =====
  function clearThinkingBoxes() {
    document.querySelectorAll('.thinking-box').forEach(el => el.remove());
  }

  // ===== INPUT AUTO-RESIZE =====
  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
    sendBtn.disabled = input.value.trim().length === 0 || state.isWaiting;
  });

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      if (!sendBtn.disabled) sendMessage();
    }
  });

  sendBtn.addEventListener('click', () => sendMessage());

  // ===== SUGGESTIONS =====
  function bindSuggestions() {
    document.querySelectorAll('.suggestion-card').forEach(card => {
      card.addEventListener('click', () => {
        input.value = card.dataset.prompt;
        input.dispatchEvent(new Event('input'));
        sendMessage();
      });
    });
  }

  // ===== MODAL RESET =====
  const modal = $('modalOverlay');
  $('resetMemoryBtn').addEventListener('click', () => modal.classList.add('show'));
  $('modalCancel').addEventListener('click', () => modal.classList.remove('show'));
  $('modalConfirm').addEventListener('click', async () => {
    modal.classList.remove('show');
    await resetAllMemory();
  });
  modal.addEventListener('click', (e) => {
    if (e.target === modal) modal.classList.remove('show');
  });

  // ===== SEND MESSAGE =====
  async function sendMessage(overrideText = null) {
    const text = overrideText !== null ? overrideText : input.value.trim();
    if (!text || state.isWaiting) return;

    clearThinkingBoxes(); // Clear any existing thinking boxes

    const welcome = $('welcome');
    if (welcome) welcome.remove();

    // Create new session if doesn't exist
    if (!state.currentSessionId) {
      state.currentSessionId = 'sess-' + Date.now();
      state.sessions[state.currentSessionId] = {
        id: state.currentSessionId,
        title: text.length > 50 ? text.substring(0, 50) + '...' : text,
        timestamp: Date.now(),
        messages: []
      };
      saveSessions();
    }

    // Add user message (if it's not an override from edit/retry)
    if (overrideText === null) {
      addMessage('user', text, true, false);
      input.value = '';
      input.style.height = 'auto';
    }
    
    sendBtn.disabled = true;
    state.isWaiting = true;

    const thinkingEl = addThinking();

    try {
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 30000);

      const res = await fetch(`${API_BASE}/chat`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question: text, user_id: getApiUserId() }),
        signal: controller.signal
      });
      clearTimeout(timeout);

      if (!res.ok) throw new Error('Server error (' + res.status + ')');

      const data = await res.json();
      thinkingEl.remove();
      
      let rawAnswer = data.answer || '(No answer)';
      let thinkingText = data.thinking || '';
      
      // Parse  tags if inside answer
      const thinkMatch = rawAnswer.match(/([\s\S]*?)```/);
      if (thinkMatch) {
        thinkingText = thinkMatch[1].trim();
        rawAnswer = rawAnswer.replace(/[\s\S]*?```/, '').trim();
      }
      
      if (thinkingText) {
        const thinkBox = createThinkingBox(thinkingText, false);
        chatContainer.appendChild(thinkBox);
        
        // Auto-collapse after 3s
        setTimeout(() => {
          thinkBox.classList.add('collapsed');
          scrollToBottom();
        }, 3000);
      }

      addMessage('ai', rawAnswer, true, false);

    } catch (err) {
      thinkingEl.remove();
      const errMsg = err.name === 'AbortError'
        ? '⏱️ Request timed out. Please try again.'
        : '⚠️ Sorry, an error occurred: ' + err.message;
      addMessage('ai', errMsg, true, false);
      showToast('Failed to send message', 'error');
    } finally {
      state.isWaiting = false;
      sendBtn.disabled = input.value.trim().length === 0;
      input.focus();
    }
  }

  function addMessage(role, text, save = true, isEdited = false, customIndex = null) {
    const msg = document.createElement('div');
    msg.className = 'msg';
    const isUser = role === 'user';
    const avatarClass = isUser ? 'user' : 'ai';
    const avatarText = isUser ? 'G' : 'C';

    let msgIndex = customIndex;
    if (save) {
      const session = state.sessions[state.currentSessionId];
      session.messages.push({ role, text, edited: isEdited });
      msgIndex = session.messages.length - 1;
      saveSessions();
      if (isUser) renderHistoryList(); // Update title in history
    }

    msg.innerHTML = `
      <div class="msg-row ${role}">
        <div class="msg-avatar ${avatarClass}">${avatarText}</div>
        <div class="msg-content-wrap">
          <div class="msg-bubble">
            <div class="msg-text">${formatMessage(text)} ${isEdited ? '<span class="edited-tag">(edited)</span>' : ''}</div>
          </div>
          <div class="msg-meta">
            ${isUser ? `
              <button class="msg-action-btn" data-action="edit">
                <i class="icon-edit-3"></i>Edit
              </button>
            ` : `
              <button class="msg-action-btn" data-action="retry">
                <i class="icon-refresh-cw"></i>Retry
              </button>
            `}
            <button class="msg-action-btn" data-action="copy">
              <i class="icon-copy"></i>Copy
            </button>
          </div>
        </div>
      </div>
    `;

    chatContainer.appendChild(msg);

    // Copy action
    msg.querySelector('[data-action="copy"]').addEventListener('click', () => {
      navigator.clipboard.writeText(text).then(() => showToast('Copied to clipboard', 'success'));
    });

    // Edit action
    const editBtn = msg.querySelector('[data-action="edit"]');
    if (editBtn) {
      editBtn.addEventListener('click', () => {
        startEditMessage(msg, msgIndex);
      });
    }

    // Retry action
    const retryBtn = msg.querySelector('[data-action="retry"]');
    if (retryBtn) {
      retryBtn.addEventListener('click', () => {
        clearThinkingBoxes(); // CLEAR THINKING BOXES ON RETRY
        msg.remove();
        const session = state.sessions[state.currentSessionId];
        if (session.messages[msgIndex].role === 'ai') {
          session.messages.pop(); // Remove this AI message from state
          saveSessions();
        }
        // Find the user message that triggered this
        const prevUserMsg = [...session.messages].reverse().find(m => m.role === 'user');
        if (prevUserMsg) {
          sendMessage(prevUserMsg.text);
        }
      });
    }

    scrollToBottom();
    return msg;
  }

  // ===== EDIT MESSAGE LOGIC =====
  function startEditMessage(msgEl, msgIndex) {
    const session = state.sessions[state.currentSessionId];
    const msgData = session.messages[msgIndex];
    const bubble = msgEl.querySelector('.msg-bubble');
    const originalText = msgData.text;

    bubble.innerHTML = `
      <textarea class="edit-textarea">${escapeHtml(originalText)}</textarea>
      <div class="edit-actions">
        <button class="edit-btn cancel">Cancel (Esc)</button>
        <button class="edit-btn save">Save & Send (Enter)</button>
      </div>
    `;

    const textarea = bubble.querySelector('.edit-textarea');
    textarea.focus();
    textarea.style.height = 'auto';
    textarea.style.height = textarea.scrollHeight + 'px';

    textarea.addEventListener('input', () => {
      textarea.style.height = 'auto';
      textarea.style.height = textarea.scrollHeight + 'px';
    });

    textarea.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        saveEdit(textarea.value, msgIndex, msgEl);
      } else if (e.key === 'Escape') {
        cancelEdit(msgIndex, msgEl);
      }
    });

    bubble.querySelector('.edit-btn.save').addEventListener('click', () => saveEdit(textarea.value, msgIndex, msgEl));
    bubble.querySelector('.edit-btn.cancel').addEventListener('click', () => cancelEdit(msgIndex, msgEl));
  }

  function cancelEdit(msgIndex, msgEl) {
    const session = state.sessions[state.currentSessionId];
    const msgData = session.messages[msgIndex];
    msgEl.querySelector('.msg-bubble').innerHTML = `
      <div class="msg-text">${formatMessage(msgData.text)} ${msgData.edited ? '<span class="edited-tag">(edited)</span>' : ''}</div>
    `;
  }

  function saveEdit(newText, msgIndex, msgEl) {
    newText = newText.trim();
    if (!newText) return cancelEdit(msgIndex, msgEl);

    const session = state.sessions[state.currentSessionId];
    
    // 1. Update state
    session.messages[msgIndex].text = newText;
    session.messages[msgIndex].edited = true;
    
    // 2. Truncate messages after this one
    session.messages = session.messages.slice(0, msgIndex + 1);
    saveSessions();
    
    // 3. Remove DOM elements after this one
    let currentEl = msgEl.nextElementSibling;
    while(currentEl) {
      let next = currentEl.nextElementSibling;
      currentEl.remove();
      currentEl = next;
    }
    msgEl.remove();
    
    // 4. Re-render this specific user message
    addMessage('user', newText, false, true, msgIndex);
    
    // 5. Trigger API call
    clearThinkingBoxes();
    sendMessage(newText);
  }

  function addThinking() {
    const msg = document.createElement('div');
    msg.className = 'msg thinking';
    msg.innerHTML = `
      <div class="msg-row ai">
        <div class="msg-avatar ai ai-avatar-thinking">C</div>
        <div class="msg-content-wrap">
          <div class="msg-bubble">
            <span class="thinking-text">CrackedNetwork AI is thinking</span>
            <span class="thinking-dots">
              <span></span><span></span><span></span>
            </span>
          </div>
        </div>
      </div>
    `;
    chatContainer.appendChild(msg);
    scrollToBottom();
    return msg;
  }

  // ===== CREATE THINKING BOX =====
  function createThinkingBox(text, skipAnimation = false) {
    const box = document.createElement('div');
    box.className = 'thinking-box';
    if (skipAnimation) box.classList.add('collapsed');
    
    box.innerHTML = `
      <div class="thinking-header">
        <span class="brain-icon">🧠</span>
        <span class="label">AI is thinking...</span>
        <button class="toggle-btn">
          <i class="icon-chevron-down"></i>
        </button>
      </div>
      <div class="thinking-body">${formatMessage(text)}</div>
    `;

    const header = box.querySelector('.thinking-header');
    const chevron = box.querySelector('.toggle-btn i');

    header.addEventListener('click', (e) => {
      if (box.dataset.dragged === 'true') {
        box.dataset.dragged = 'false';
        return;
      }
      box.classList.toggle('collapsed');
      chevron.className = 'icon-chevron-down';
      scrollToBottom();
    });

    // Drag Logic
    let isDragging = false;
    let startY = 0;
    let currentY = 0;

    const startDrag = (e) => {
      if (e.target.closest('.toggle-btn')) return;
      isDragging = true;
      box.classList.add('dragging');
      box.style.transition = 'none';
      startY = (e.touches ? e.touches[0].clientY : e.clientY) - currentY;
      
      document.addEventListener('mousemove', moveDrag);
      document.addEventListener('touchmove', moveDrag, { passive: false });
      document.addEventListener('mouseup', endDrag);
      document.addEventListener('touchend', endDrag);
      e.preventDefault();
    };

    const moveDrag = (e) => {
      if (!isDragging) return;
      e.preventDefault();
      const y = e.touches ? e.touches[0].clientY : e.clientY;
      currentY = y - startY;
      box.style.transform = `translateY(${currentY}px)`;
      if (Math.abs(currentY) > 5) box.dataset.dragged = 'true';
    };

    const endDrag = () => {
      if (!isDragging) return;
      isDragging = false;
      box.classList.remove('dragging');
      box.style.transition = 'transform 0.2s ease, box-shadow 0.2s ease';
      document.removeEventListener('mousemove', moveDrag);
      document.removeEventListener('touchmove', moveDrag);
      document.removeEventListener('mouseup', endDrag);
      document.removeEventListener('touchend', endDrag);
    };

    header.addEventListener('mousedown', startDrag);
    header.addEventListener('touchstart', startDrag, { passive: false });

    return box;
  }

  function scrollToBottom() {
    requestAnimationFrame(() => {
      chatArea.scrollTop = chatArea.scrollHeight;
    });
  }

  // ===== MARKDOWN-LITE FORMATTER =====
  function formatMessage(text) {
    if (!text) return '';
    let html = text
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');

    html = html.replace(/```(\w*)\n?([\s\S]*?)```/g, (m, lang, code) => {
      return `<pre><code>${code.trim()}</code></pre>`;
    });
    html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
    html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    html = html.replace(/(?<!\*)\*([^*]+)\*(?!\*)/g, '<em>$1</em>');
    html = html.replace(/\n/g, '<br>');
    return html;
  }

  // ===== RESET ALL MEMORY =====
  async function resetAllMemory() {
    showToast('Resetting all memory...', 'info');
    try {
      // Call reset for current session if exists
      if (state.currentSessionId) {
        await fetch(`${API_BASE}/reset`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ user_id: getApiUserId() })
        });
      }

      // Clear local storage
      localStorage.removeItem('cn_sessions');
      state.sessions = {};
      state.currentSessionId = null;
      
      // Render welcome
      chatContainer.innerHTML = '';
      renderWelcome();
      renderHistoryList();

      showToast('✅ All history and memory reset', 'success');
    } catch (err) {
      showToast('Failed to reset memory', 'error');
    }
  }

  // ===== TOAST =====
  let toastTimer;
  function showToast(msg, type = 'success') {
    const icons = {
      success: 'icon-check-circle',
      error: 'icon-alert-circle',
      info: 'icon-info'
    };
    toastText.textContent = msg;
    const iconEl = toast.querySelector('i');
    iconEl.className = icons[type] || icons.success;
    toast.classList.toggle('error', type === 'error');
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 2400);
  }

  // ===== UTILS =====
  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // ===== START =====
  initApp();
  input.focus();
</script>
</body>
</html>
