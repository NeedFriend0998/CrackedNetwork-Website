<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Outfit', sans-serif;
            background: #0e0e10;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            color: #fff;
        }

        .box {
            background: #1a1a1f;
            border: 1px solid #2a2a30;
            border-radius: 16px;
            padding: 3rem;
            max-width: 520px;
            width: 100%;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .box::before {
            content: '';
            position: absolute;
            top: -60%;
            left: 50%;
            transform: translateX(-50%);
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(220, 38, 38, 0.08) 0%, transparent 70%);
            pointer-events: none;
        }

        .box-icon {
            width: 64px;
            height: 64px;
            background: rgba(220, 38, 38, 0.1);
            border: 1px solid rgba(220, 38, 38, 0.2);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
        }

        .box-icon svg {
            width: 30px;
            height: 30px;
            stroke: #dc2626;
            fill: none;
            stroke-width: 2;
        }

        .box-title {
            color: #dc2626;
            font-size: 1.6rem;
            font-weight: 800;
            margin-bottom: 0.75rem;
            line-height: 1.3;
        }

        .box-text {
            color: #72727a;
            font-size: 0.95rem;
            line-height: 1.7;
            margin-bottom: 2rem;
        }

        .box-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.7rem 1.6rem;
            background: #dc2626;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s, transform 0.15s;
            text-decoration: none;
        }

        .box-btn:hover {
            background: #b91c1c;
            transform: translateY(-1px);
        }

        .box-btn svg {
            width: 16px;
            height: 16px;
            stroke: #fff;
            fill: none;
            stroke-width: 2;
        }
    </style>
</head>
<body>

    <div class="box">
        <div class="box-icon">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        </div>
        <h1 class="box-title">Page Not Found</h1>
        <p class="box-text">The page you're looking for doesn't exist or has been moved. Check the URL or head back to the homepage.</p>
        <button id="backBtn" class="box-btn">
  <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
  Back
</button>
    </div>
  <script>
    (function() {
      var path = window.location.pathname;
      var search = window.location.search;
      // Validasi path sederhana
      if (path && path.charAt(0) === '/' && path.charAt(1) !== '/') {
        window.location.replace(
          window.location.origin + '/?p=' + encodeURIComponent(path + search)
        );
      } else {
        window.location.replace(window.location.origin);
      }
    })();

    (function() {
      var validRoutes = [
        '/home', '/gamemodes', '/wiki', '/rules',
        '/vote', '/store', '/ai', '/discord', '/forums',
        '/plugins', '/donate', '/legal',
        '/terms-of-service', '/privacy-policy',
        '/staff-detail', '/404'
      ];

      var path = window.location.pathname.replace(/\/$/, '') || '/';
      var search = window.location.search;

      if (validRoutes.indexOf(path) !== -1) {
        window.location.replace(
          window.location.origin + '/?p=' + encodeURIComponent(path + search)
        );
      }
      // Kalo bukan route valid → tampilin 404 (gak redirect)
    })();

        document.getElementById('backBtn').addEventListener('click', function() {
    // Cek apakah user punya history sebelumnya
    if (window.history.length > 1 && document.referrer) {
      // Kembali ke halaman sebelumnya
      window.history.back();
    } else {
      // Fallback: kalo gak ada history, balik ke home
      window.location.href = '/';
    }
  });
  </script>
</body>
</html>
