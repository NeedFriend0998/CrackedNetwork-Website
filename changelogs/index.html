<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Changelog - CrackedNetwork</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: transparent;
        }

        .dirt-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background-repeat: repeat;
            background-size: 64px 64px;
            image-rendering: pixelated;
            opacity: 1;
        }

        .scroll-container {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            position: relative;
            z-index: 5;
        }

        .scroll-container.manual {
            overflow-y: auto;
            overflow-x: hidden;
        }

        .scroll-container.manual::-webkit-scrollbar { width: 12px; }
        .scroll-container.manual::-webkit-scrollbar-track { background: #1a1008; }
        .scroll-container.manual::-webkit-scrollbar-thumb { background: #5c3a1e; border: 2px solid #1a1008; }
        .scroll-container.manual::-webkit-scrollbar-thumb:hover { background: #7a4d28; }

        .scrolling-text {
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            width: 85%;
            max-width: 800px;
            text-align: center;
            color: #ffffff;
            font-family: 'Press Start 2P', 'Courier New', monospace;
            font-size: 14px;
            line-height: 2.5;
            letter-spacing: 0.5px;
            text-shadow: 2px 2px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000;
            padding: 40px 0;
            -webkit-font-smoothing: none;
            font-smooth: never;
        }

        .scrolling-text.manual-mode {
            position: relative;
            top: 0;
            animation: none;
            transform: translateX(-50%);
            margin: 0 auto;
            padding: 60px 20px;
        }

        .scrolling-text.auto-scroll {
            animation: scrollUp 60s linear infinite;
        }

        @keyframes scrollUp {
            0%   { top: 100%; }
            100% { top: -100%; }
        }

        .scrolling-text h1 {
            font-size: 22px;
            color: #fbbf24;
            margin-bottom: 20px;
            text-transform: uppercase;
            text-shadow: 3px 3px 0 #78350f, 2px 2px 0 #000;
        }

        .entry {
            margin-bottom: 50px;
            padding-bottom: 30px;
            border-bottom: 2px dashed #5c3a1e;
        }

        .entry h2 {
            font-size: 16px;
            color: #34d399;
            margin-bottom: 15px;
            text-shadow: 2px 2px 0 #064e3b, 1px 1px 0 #000;
        }

        .entry .date {
            font-size: 10px;
            color: #9ca3af;
            margin-bottom: 20px;
        }

        .entry ul {
            list-style: none;
            padding: 0;
            text-align: left;
            display: inline-block;
            max-width: 100%;
        }

        .entry ul li {
            margin-bottom: 12px;
            position: relative;
            padding-left: 25px;
            font-size: 12px;
            line-height: 2;
        }

        .entry ul li::before {
            content: "►";
            color: #fbbf24;
            position: absolute;
            left: 0;
            font-size: 10px;
        }

        .toggle-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
            font-family: 'Press Start 2P', monospace;
            font-size: 10px;
            padding: 12px 16px;
            background: #5c3a1e;
            color: #fbbf24;
            border: 3px solid #1a1008;
            cursor: pointer;
            text-shadow: 1px 1px 0 #000;
            box-shadow: inset -3px -3px 0 #3a2512, inset 3px 3px 0 #7a4d28, 0 0 0 3px #000;
            -webkit-font-smoothing: none;
        }

        .toggle-btn:hover { background: #7a4d28; color: #fde68a; }
        .toggle-btn.paused { background: #7f1d1d; color: #fecaca; }
        .toggle-btn.paused:hover { background: #991b1b; }

        .fade-top, .fade-bottom {
            position: fixed;
            left: 0;
            width: 100%;
            height: 120px;
            z-index: 10;
            pointer-events: none;
        }

        .fade-top { top: 0; background: linear-gradient(to bottom, #2c1b0e 0%, transparent 100%); }
        .fade-bottom { bottom: 0; background: linear-gradient(to top, #2c1b0e 0%, transparent 100%); }

        .scroll-container.manual ~ .fade-top,
        .scroll-container.manual ~ .fade-bottom { display: none; }

        .error-msg {
            color: #fecaca;
            background: #7f1d1d;
            padding: 20px;
            border: 3px solid #000;
            font-size: 10px;
            line-height: 2;
            max-width: 600px;
            margin: 100px auto;
        }

        @media (max-width: 600px) {
            .scrolling-text { font-size: 11px; width: 90%; }
            .scrolling-text h1 { font-size: 16px; }
            .entry h2 { font-size: 13px; }
            .entry ul li { font-size: 10px; }
            .toggle-btn { font-size: 8px; padding: 10px 12px; }
        }
    </style>
</head>
<body>

    <div class="dirt-background" id="dirtBg"></div>

    <button class="toggle-btn" id="toggleBtn" onclick="toggleScroll()">⏸ PAUSE SCROLL</button>

    <div class="fade-top"></div>
    <div class="fade-bottom"></div>

    <div class="scroll-container" id="scrollContainer">
        <div class="scrolling-text auto-scroll" id="scrollingText">
            <h1>🚀 CRACKEDNETWORK CHANGELOG 🚀</h1>
            <div id="changelogContainer">
                <p>Loading changelog...</p>
            </div>
        </div>
    </div>

    <script>
        // ================= BACKGROUND =================
        const DIRT_IMAGE_PATH = 'dirt.png';
        document.getElementById('dirtBg').style.backgroundImage = `url('${DIRT_IMAGE_PATH}')`;

        // ================= NAMA BULAN =================
        const BULAN = {
            1: 'Januari', 2: 'Februari', 3: 'Maret', 4: 'April',
            5: 'Mei', 6: 'Juni', 7: 'Juli', 8: 'Agustus',
            9: 'September', 10: 'Oktober', 11: 'November', 12: 'Desember'
        };

        // ================= LOAD CHANGELOG.JSON =================
        async function loadChangelog() {
            const container = document.getElementById('changelogContainer');

            try {
                const response = await fetch('changelog.json');
                if (!response.ok) throw new Error('HTTP ' + response.status);
                const data = await response.json();

                // Konversi ke array biar bisa di-sort
                const entries = Object.keys(data).map(key => {
                    const [tgl, bln, thn] = key.split(':').map(Number);
                    return {
                        date: new Date(thn, bln - 1, tgl),
                        tanggal: tgl,
                        bulan: bln,
                        tahun: thn,
                        items: data[key].split('\n')
                    };
                });

                // Sort dari yang terbaru
                entries.sort((a, b) => b.date - a.date);

                // Render
                container.innerHTML = '';
                entries.forEach(entry => {
                    const title = entry.items[0];
                    const listItems = entry.items.slice(1);

                    const div = document.createElement('div');
                    div.className = 'entry';

                    const h2 = document.createElement('h2');
                    h2.textContent = title;
                    div.appendChild(h2);

                    const dateEl = document.createElement('p');
                    dateEl.className = 'date';
                    dateEl.textContent = `${entry.tanggal} ${BULAN[entry.bulan]} ${entry.tahun}`;
                    div.appendChild(dateEl);

                    if (listItems.length > 0) {
                        const ul = document.createElement('ul');
                        listItems.forEach(item => {
                            if (item.trim()) {
                                const li = document.createElement('li');
                                li.textContent = item.trim();
                                ul.appendChild(li);
                            }
                        });
                        div.appendChild(ul);
                    }

                    container.appendChild(div);
                });

                console.log('✅ Changelog berhasil dimuat:', entries.length, 'entri');

            } catch (err) {
                console.error('❌ Gagal load changelog.json:', err);
                container.innerHTML = `
                    <div class="error-msg">
                        ❌ GAGAL LOAD changelog.json<br><br>
                        Error: ${err.message}<br><br>
                        KEMUNGKINAN PENYEBAB:<br>
                        1. File changelog.json tidak ada di folder yang sama<br>
                        2. HTML dibuka lewat file:// (browser blokir fetch)<br><br>
                        SOLUSI:<br>
                        Jalankan local server:<br>
                        <code>python3 -m http.server 8000</code><br>
                        Lalu buka http://localhost:8000
                    </div>
                `;
            }
        }

        loadChangelog();

        // ================= TOGGLE AUTO-SCROLL =================
        const scrollContainer = document.getElementById('scrollContainer');
        const scrollingText = document.getElementById('scrollingText');
        const toggleBtn = document.getElementById('toggleBtn');
        let isAutoScroll = true;

        function toggleScroll() {
            isAutoScroll = !isAutoScroll;
            if (isAutoScroll) {
                scrollContainer.classList.remove('manual');
                scrollingText.classList.remove('manual-mode');
                scrollingText.classList.add('auto-scroll');
                toggleBtn.classList.remove('paused');
                toggleBtn.innerHTML = '⏸ PAUSE SCROLL';
                scrollContainer.scrollTop = 0;
            } else {
                scrollContainer.classList.add('manual');
                scrollingText.classList.remove('auto-scroll');
                scrollingText.classList.add('manual-mode');
                toggleBtn.classList.add('paused');
                toggleBtn.innerHTML = '▶ RESUME SCROLL';
            }
        }
    </script>
</body>
</html>
