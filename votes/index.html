<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vote Page</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<style>

/* ===== Global ===== */
body {
  background-color: black;
  color: white;
}

.vote-container {
  display: flex;
  gap: 30px;
  align-items: flex-start;
  justify-content: center;
  flex-wrap: wrap;
  margin-top: 40px;
}

.vote-buttons {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.vote-btn {
  color: black;
  background-color: greenyellow;
  text-decoration: none;
  text-align: center;
  width: 180px;
  height: 42px;
  line-height: 42px;
  border-radius: 6px;
}

/* video wrapper */
.video-wrapper {
  max-width: 450px;
}

.video-wrapper video {
  width: 100%;
  border: 3px solid greenyellow;
  border-radius: 8px;
}

/* ===== RESPONSIVE (MOBILE) ===== */
@media (max-width: 767px) {
  .vote-container {
    flex-direction: column;
    align-items: center;
  }

  /* Video otomatis turun setelah tombol terakhir */
  .video-wrapper {
    order: 1;
    margin-top: 20px;
  }
}
</style>
</head>
<body>

<div class="vote-container">

  <div class="vote-buttons">
    <a class="vote-btn" href="https://minecraft-mp.com/server/352192/vote/">Vote 1</a>
    <a class="vote-btn" href="#">Vote 2</a>
    <a class="vote-btn" href="#">Vote 3</a>
    <a class="vote-btn" href="#">Vote 4</a>
    <a class="vote-btn" href="#">Vote 5</a>
  </div>

  <div class="video-wrapper">
    <video controls controlsList="nodownload">
      <source src="a.com">
    </video>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
